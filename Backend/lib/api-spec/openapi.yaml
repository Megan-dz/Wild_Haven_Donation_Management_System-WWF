          type: number
        activeCampaignCount:
          type: integer
        monthlyRecurring:
          type: number
        monthlyRecurringChange:
          type: number
        campaignProgress:
          type: array
          items:
            $ref: "#/components/schemas/CampaignProgress"
        donationTrend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
      required:
