openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Wild Haven employee operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Staff authentication and profile
  - name: dashboard
    description: Mission and donation overview
  - name: donors
    description: Donor records
  - name: donations
    description: Donation records
  - name: campaigns
    description: Conservation campaigns
  - name: tasks
    description: Staff task management
  - name: impact
    description: Impact reporting
  - name: rescue
    description: Wildlife rescue case management
  - name: volunteers
    description: Volunteer management and engagement
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentStaff
      tags: [auth]
      summary: Get the current staff member
      responses:
        "200":
          description: Current staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the operations dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent staff activity
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /donation-analytics:
    get:
      operationId: getDonationAnalytics
      tags: [dashboard]
      summary: Get filtered donation analytics
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DonationStatus"
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Donation analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationAnalytics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List staff tasks
      parameters:
        - name: employeeId
          in: query
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Staff tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Task record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Task deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /donors:
    get:
      operationId: listDonors
      tags: [donors]
      summary: List searchable donor records
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Donor records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donor"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDonor
      tags: [donors]
      summary: Create a donor record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonorInput"
      responses:
        "201":
          description: Donor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteAllDonors
      tags: [donors]
      summary: Not supported; included only to keep the collection contract explicit
      responses:
        "405":
          description: Method not allowed
  /donors/{id}:
    get:
      operationId: getDonor
      tags: [donors]
      summary: Get a donor record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Donor record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDonor
      tags: [donors]
      summary: Update a donor record
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonorUpdate"
      responses:
        "200":
          description: Donor updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDonor
      tags: [donors]
      summary: Delete a donor record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Donor deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /donations:
    get:
      operationId: listDonations
      tags: [donations]
      summary: List donation records
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DonationStatus"
        - name: campaignId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Donation records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDonation
      tags: [donations]
      summary: Record a donation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationInput"
      responses:
        "201":
          description: Donation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /donations/{id}:
    get:
