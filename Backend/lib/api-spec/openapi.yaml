          schema:
            $ref: "#/components/schemas/VolunteerStatus"
        - name: skills
          in: query
          schema:
            type: string
        - name: availability
          in: query
          schema:
            $ref: "#/components/schemas/VolunteerAvailability"
        - name: assignmentType
          in: query
          schema:
            $ref: "#/components/schemas/VolunteerAssignmentType"
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, joinedDate, status, createdAt]
      responses:
        "200":
          description: Volunteer records
          content:
            application/json:
              schema:
                type: array
                items:
